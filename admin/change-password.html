<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password · CAMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@500;650;700;750&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
</head>
<body class="admin-body">
  <div class="admin-shell">
    <aside class="admin-sidebar" data-admin-sidebar>
      <a class="brand" href="dashboard.html">
        <img class="brand-logo" src="/assets/care-logo.jpg" alt="" aria-hidden="true">
        <span class="brand-text"><strong>CARE Kenya</strong><span data-brand-subtitle>CAMS</span></span>
      </a>
      <nav class="admin-nav" data-admin-nav aria-label="Admin"></nav>
    </aside>
    <div class="admin-main">
      <header class="admin-topbar">
        <button type="button" class="btn btn-secondary btn-sm admin-menu-toggle" data-admin-menu-toggle>Menu</button>
        <h1 style="font-size:var(--text-lg);margin:0;">Change Password</h1>
        <div class="admin-user">
          <div class="admin-user-meta"><strong data-admin-name>—</strong><span data-admin-role></span></div>
          <button type="button" class="btn btn-ghost btn-sm" data-logout>Sign out</button>
        </div>
      </header>
      <div class="admin-content">
        <div class="page-header">
          <h2 style="font-size:var(--text-xl);">Change Password</h2>
          <p>Update your account password. You will stay signed in after saving.</p>
        </div>
        <div class="panel" style="max-width:480px;">
          <form id="change-password-form" novalidate>
            <div class="form-grid">
              <div class="form-group">
                <label class="form-label" for="currentPassword">Current Password <span class="required">*</span></label>
                <input class="form-control" type="password" id="currentPassword" name="currentPassword" autocomplete="current-password" required>
                <span class="form-error" data-error-for="currentPassword"></span>
              </div>
              <div class="form-group">
                <label class="form-label" for="newPassword">New Password <span class="required">*</span></label>
                <input class="form-control" type="password" id="newPassword" name="newPassword" autocomplete="new-password" required>
                <span class="form-hint">At least 8 characters</span>
                <span class="form-error" data-error-for="newPassword"></span>
              </div>
              <div class="form-group">
                <label class="form-label" for="confirmPassword">Confirm New Password <span class="required">*</span></label>
                <input class="form-control" type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required>
                <span class="form-error" data-error-for="confirmPassword"></span>
              </div>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary" id="change-password-submit">Update Password</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="../js/pages/admin-change-password.js"></script>
</body>
</html>
