<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login · CAMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@500;650;700;750&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css?v=20260907-16">
</head>
<body class="login-page">
  <div class="login-scenery" aria-hidden="true">
    <span class="scenery-sun"></span>
    <span class="scenery-mountain scenery-mountain-back"></span>
    <span class="scenery-mountain scenery-mountain-front"></span>
    <span class="scenery-tree scenery-tree-left"></span>
    <span class="scenery-tree scenery-tree-right"></span>
    <span class="scenery-mist"></span>
  </div>
  <div class="login-galaxy" aria-hidden="true">
    <span class="galaxy-star"></span><span class="galaxy-star"></span><span class="galaxy-star"></span>
    <span class="galaxy-star"></span><span class="galaxy-star"></span><span class="galaxy-star"></span>
    <span class="galaxy-star"></span><span class="galaxy-star"></span><span class="galaxy-star"></span>
    <span class="galaxy-star"></span><span class="galaxy-star"></span><span class="galaxy-star"></span>
  </div>
  <div class="login-leaves" aria-hidden="true">
    <span class="login-leaf"></span><span class="login-leaf"></span><span class="login-leaf"></span>
    <span class="login-leaf"></span><span class="login-leaf"></span><span class="login-leaf"></span>
    <span class="login-leaf"></span><span class="login-leaf"></span><span class="login-leaf"></span>
    <span class="login-leaf"></span><span class="login-leaf"></span><span class="login-leaf"></span>
  </div>
  <div class="login-panel panel">
    <div class="login-brand">
      <img class="brand-logo" src="/assets/care-logo.jpg" alt="" aria-hidden="true">
      <h1 style="font-size:var(--text-xl);margin-bottom:var(--space-2);">Staff Login</h1>
      <p class="mb-0">CARE Accommodation Management System</p>
    </div>

    <button type="button" class="reservation-log-bag login-entry-bag" id="open-login-form" aria-controls="login-form" aria-expanded="false">
      <span class="login-entry-kicker">Secure staff access</span>
      <span class="reservation-log-illustration" aria-hidden="true">
        <svg viewBox="0 0 180 150" role="presentation">
          <path class="reservation-log-ground" d="M24 132h132" />
          <ellipse class="login-cartoon-shadow" cx="85" cy="133" rx="54" ry="5" />
          <circle class="reservation-log-head" cx="68" cy="34" r="17" />
          <circle class="login-cartoon-eye" cx="63" cy="32" r="2.5" />
          <circle class="login-cartoon-eye" cx="74" cy="32" r="2.5" />
          <path class="login-cartoon-smile" d="M63 40c4 4 8 4 12 0" />
          <path class="login-cartoon-body" d="M54 55c8-8 24-8 32 0l7 37H47z" />
          <path class="login-walk-arm login-walk-arm-back" d="M56 62 37 82" />
          <path class="login-walk-arm login-walk-arm-front" d="M84 62 103 80" />
          <circle class="login-cartoon-hand" cx="103" cy="80" r="5" />
          <path class="login-walk-leg login-walk-leg-back" d="M63 91 43 130" />
          <path class="login-walk-leg login-walk-leg-front" d="M75 91 101 130" />
          <path class="login-cartoon-shoe" d="M36 129h13c3 0 4 4 0 5H35c-4 0-4-4 1-5Zm58 0h13c5 0 6 5 1 5H93c-4 0-4-4 1-5Z" />
          <path class="reservation-log-bag-strap" d="M88 57c12-6 25-2 29 10" />
          <path class="reservation-log-bag" d="M119 67h35l-4 39h-27z" />
          <path class="reservation-log-bag-handle" d="M127 67c0-12 19-12 19 0" />
          <path class="reservation-log-paper" d="M126 79h20m-17 8h14m-11 8h10" />
        </svg>
      </span>
      <span class="reservation-log-bag-label">Enter CAMS</span>
      <span class="reservation-log-bag-hint">Click the bag to open staff sign-in</span>
    </button>
    <form id="login-form" novalidate hidden>
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label" for="email">Email <span class="required" aria-hidden="true">*</span></label>
          <input class="form-control" type="email" id="email" name="email" autocomplete="username" required>
          <span class="form-error" data-error-for="email"></span>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password <span class="required" aria-hidden="true">*</span></label>
          <input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required>
          <span class="form-error" data-error-for="password"></span>
        </div>
      </div>
      <div class="form-actions" style="margin-top:var(--space-5);">
        <button class="btn btn-primary btn-block" type="submit" id="login-submit">Sign In</button>
      </div>
    </form>
    <section class="mfa-login-panel" id="mfa-panel" hidden aria-labelledby="mfa-title">
      <p class="login-success-kicker">Microsoft Authenticator</p>
      <h2 id="mfa-title">Verify your account</h2>
      <p id="mfa-instructions">Scan this QR code in Microsoft Authenticator, then enter the six-digit code.</p>
      <img id="mfa-qr-code" class="mfa-qr-code" alt="Microsoft Authenticator setup QR code" hidden>
      <p class="mfa-manual-key" id="mfa-manual-key" hidden></p>
      <button class="btn btn-secondary btn-block" type="button" id="mfa-qr-done" hidden>I've scanned the QR code</button>
      <label class="form-label" for="mfa-code" id="mfa-code-label" hidden>Authenticator code</label>
      <input class="form-control" type="text" id="mfa-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" hidden>
      <button class="btn btn-primary btn-block" type="button" id="mfa-submit" hidden>Verify and continue</button>
    </section>
  </div>
  <div class="login-success-overlay" id="login-success" role="status" aria-live="polite" hidden>
    <div class="login-success-card">
      <div class="care-auth-scanner" aria-hidden="true">
        <span class="care-auth-ring care-auth-ring-outer"></span>
        <span class="care-auth-ring care-auth-ring-inner"></span>
        <span class="care-auth-scan-beam"></span>
        <img class="care-auth-logo" src="/assets/care-logo.png" alt="CARE">
        <span class="care-auth-check">✓</span>
      </div>
      <p class="care-auth-status" id="login-auth-status">Scanning CARE identity</p>
      <p class="login-success-kicker">Secure access granted</p>
      <h2 class="login-success-title" id="login-success-title">Welcome</h2>
      <p class="login-success-copy">Preparing your CAMS workspace…</p>
    </div>
  </div>

  <script type="module" src="../js/pages/admin-login.js?v=20260907-5"></script>
</body>
</html>
