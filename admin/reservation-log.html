<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservation Log · CAMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@500;650;700;750&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
</head>
<body class="admin-body">
  <div class="admin-shell">
    <aside class="admin-sidebar" data-admin-sidebar>
      <a class="brand" href="dashboard.html">
        <img class="brand-logo" src="/assets/care-logo.jpg" alt="" aria-hidden="true">
        <span class="brand-text"><strong>CARE Kenya</strong><span data-brand-subtitle>CAMS</span></span>
      </a>
      <nav class="admin-nav" data-admin-nav aria-label="Admin"></nav>
    </aside>
    <div class="admin-main">
      <header class="admin-topbar">
        <button type="button" class="btn btn-secondary btn-sm admin-menu-toggle" data-admin-menu-toggle>Menu</button>
        <h1 style="font-size:var(--text-lg);margin:0;">Reservation Log</h1>
        <div class="admin-user">
          <div class="admin-user-meta"><strong data-admin-name>—</strong><span data-admin-role></span></div>
          <button type="button" class="btn btn-ghost btn-sm" data-logout>Sign out</button>
        </div>
      </header>
      <div class="admin-content">
        <div class="page-header">
          <h2 style="font-size:var(--text-xl);">Reservation Log</h2>
          <p>Review and export the reservation log for the selected period.</p>
        </div>
        <button type="button" class="reservation-log-bag" id="open-reservation-log" aria-controls="report-filters" aria-expanded="false">
          <span class="reservation-log-illustration" aria-hidden="true">
            <svg viewBox="0 0 180 150" role="presentation">
              <path class="reservation-log-ground" d="M24 132h132" />
              <circle class="reservation-log-head" cx="72" cy="35" r="13" />
              <path class="reservation-log-body" d="M72 49v43m0-30-25 20m25-20 24 17m-24 13-19 40m19-40 24 40" />
              <path class="reservation-log-bag-strap" d="M91 60c14-8 28-5 38 8" />
              <path class="reservation-log-bag" d="M119 67h35l-4 39h-27z" />
              <path class="reservation-log-bag-handle" d="M127 67c0-12 19-12 19 0" />
              <path class="reservation-log-paper" d="M126 79h20m-17 8h14m-11 8h10" />
            </svg>
          </span>
          <span class="reservation-log-bag-label">Open Reservation Log</span>
          <span class="reservation-log-bag-hint">Click the bag to view the log form</span>
        </button>
        <form class="panel" id="report-filters" style="margin-bottom:var(--space-6);" hidden>
          <select id="reportType" name="reportType" data-fixed-type="reservation-log" hidden>
            <option value="reservation-log" selected>Reservation Log</option>
          </select>
          <div class="form-grid two-col">
            <div class="form-group"><label class="form-label" for="campId">Camp</label><select class="form-control" id="campId" name="campId"></select></div>
            <div class="form-group"><label class="form-label" for="from">From Date</label><input class="form-control" type="date" id="from" name="from"></div>
            <div class="form-group"><label class="form-label" for="to">To Date</label><input class="form-control" type="date" id="to" name="to"></div>
            <div class="form-group"><label class="form-label" for="stayType">Stay Type</label><select class="form-control" id="stayType" name="stayType"></select></div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="generate-report">Load Reservation Log</button>
            <button type="button" class="btn btn-secondary" id="export-pdf" disabled>Export PDF</button>
            <button type="button" class="btn btn-secondary" id="export-excel" disabled>Export Excel</button>
            <button type="button" class="btn btn-secondary" id="print-report" disabled>Print</button>
          </div>
        </form>
        <div class="table-wrap report-print-area" id="report-results" hidden></div>
      </div>
    </div>
  </div>
  <script type="module" src="../js/pages/admin-reports.js"></script>
</body>
</html>
