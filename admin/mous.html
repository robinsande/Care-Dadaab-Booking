<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CAMS - MOU Tracker</title>
  <link rel="icon" type="image/png" href="../assets/care-logo.png">
  <link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/layout.css">
</head>
<body class="admin-body"><div class="admin-shell"><aside class="admin-sidebar" data-admin-sidebar><a class="brand" href="/"><img class="brand-logo" src="../assets/care-logo.png" alt="CARE"><span class="brand-text"><strong>CARE Kenya</strong><span>CAMS</span></span></a><nav class="admin-nav" data-admin-nav></nav></aside><div class="admin-main"><header class="admin-topbar"><button type="button" class="btn btn-secondary btn-sm admin-menu-toggle" data-admin-menu-toggle>Menu</button><h1 style="font-size:var(--text-lg);margin:0;">MOU Tracker</h1><div class="admin-user"><div class="admin-user-meta"><strong data-admin-name>—</strong><span data-admin-role></span></div><button type="button" class="btn btn-ghost btn-sm" data-logout>Sign out</button></div></header><main class="admin-content"><div class="page-header"><h2>MOU Tracker</h2><p>Create agreements, review payment schedules, and update collection status.</p></div><form class="panel form-grid two-col" id="mou-form"><div class="form-group"><label class="form-label">MOU type</label><select class="form-control" name="mouType" required><option value="individual">Individual MOU</option><option value="partner">Partner MOU</option></select></div><div class="form-group"><label class="form-label">Party name</label><input class="form-control" name="partyName" required></div><div class="form-group"><label class="form-label">Counterparty category</label><select class="form-control" name="counterpartyCategory" required><option value="staff">Staff</option><option value="implementing_partner">Implementing partner</option><option value="government">Government</option><option value="municipality">Municipality</option></select></div><div class="form-group"><label class="form-label">Rate amount (KES)</label><input class="form-control" name="rateAmount" type="number" min="0" value="6000" required></div><div class="form-group"><label class="form-label">Start date</label><input class="form-control" name="startDate" type="date" required></div><div class="form-group"><label class="form-label">End date</label><input class="form-control" name="endDate" type="date"></div><div class="form-group full-width"><label class="form-label">Signed document reference</label><input class="form-control" name="documentRef" placeholder="URL or document reference"></div><div class="form-actions full-width"><button class="btn btn-primary" type="submit">Create MOU</button></div></form><p id="message" class="notice" role="status"></p><div class="table-wrap"><table class="table"><thead><tr><th>Party</th><th>Type</th><th>Term</th><th>Rate</th><th>Status</th><th>Payments</th></tr></thead><tbody id="mou-rows"></tbody></table></div><div class="table-wrap" id="payment-panel" hidden><h3 id="payment-title"></h3><table class="table"><thead><tr><th>Period</th><th>Due</th><th>Amount</th><th>Paid</th><th>Status</th><th>Action</th></tr></thead><tbody id="payment-rows"></tbody></table></div></main></div></div><script type="module" src="../js/pages/admin-mous.js"></script></body></html>
