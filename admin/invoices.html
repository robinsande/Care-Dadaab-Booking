<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoices · CAMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@500;650;700;750&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
</head>
<body class="admin-body">
  <div class="admin-shell">
    <aside class="admin-sidebar" data-admin-sidebar>
      <a class="brand" href="dashboard.html">
        <img class="brand-logo" src="/assets/care-logo.jpg" alt="" aria-hidden="true">
        <span class="brand-text"><strong>CARE Kenya</strong><span data-brand-subtitle>CAMS</span></span>
      </a>
      <nav class="admin-nav" data-admin-nav aria-label="Admin"></nav>
    </aside>
    <div class="admin-main">
      <header class="admin-topbar">
        <button type="button" class="btn btn-secondary btn-sm admin-menu-toggle" data-admin-menu-toggle>Menu</button>
        <h1 style="font-size:var(--text-lg);margin:0;">Invoices</h1>
        <div class="admin-user">
          <div class="admin-user-meta"><strong data-admin-name>—</strong><span data-admin-role></span></div>
          <button type="button" class="btn btn-ghost btn-sm" data-logout>Sign out</button>
        </div>
      </header>
      <div class="admin-content">
        <form class="toolbar" id="invoices-filters">
          <div class="form-group search">
            <label class="form-label" for="search">Search</label>
            <input class="form-control" type="search" id="search" name="search" placeholder="Invoice #, booking ref, guest">
          </div>
          <div class="form-group">
            <label class="form-label" style="opacity:0;">Apply</label>
            <button class="btn btn-primary" type="submit">Apply</button>
          </div>
        </form>
        <p class="form-hint" style="margin-bottom:var(--space-4);">Click a row to view, print, or download an invoice.</p>
        <div class="table-wrap">
          <table class="table" aria-label="Invoices">
            <thead>
              <tr><th>Invoice #</th><th>Booking Ref</th><th>Guest</th><th>Camp</th><th>Total</th><th>Email Status</th></tr>
            </thead>
            <tbody id="invoices-table-body"><tr><td colspan="6" class="empty-state">Loading…</td></tr></tbody>
          </table>
        </div>
        <div id="invoices-pagination"></div>
      </div>
    </div>
  </div>
  <div class="modal-backdrop" data-modal="invoice" hidden>
    <div class="modal modal-lg" role="dialog" aria-modal="true" aria-labelledby="invoice-modal-title">
      <div class="modal-header">
        <h2 id="invoice-modal-title">Invoice</h2>
        <button type="button" class="modal-close" data-close-modal="invoice" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body" id="invoice-detail-body"></div>
      <div class="modal-footer">
        <div id="invoice-email-status" class="invoice-status-actions" style="margin-right:auto;display:flex;align-items:center;gap:var(--space-3);"></div>
        <button type="button" class="btn btn-secondary" id="invoice-print-btn">Print</button>
        <button type="button" class="btn btn-secondary" id="invoice-pdf-btn">Download PDF</button>
        <button type="button" class="btn btn-secondary" data-close-modal="invoice">Close</button>
      </div>
    </div>
  </div>
  <script type="module" src="../js/pages/admin-invoices.js"></script>
</body>
</html>
